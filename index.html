<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loca Equipamentos – Sarandi/RS</title>
  <meta name="description" content="Loca Equipamentos – Sarandi/RS. Fale conosco pelo WhatsApp e confira nosso catálogo.">
  <meta name="theme-color" content="#FFC400">
  <style>
    :root {
      --amarelo: #FFC400;
      --amarelo-claro: #FFD84D;
      --azul: #1B4F9C;
      --azul-escuro: #0B2E6B;
      --verde: #25D366;
      --verde-escuro: #1DA851;
      --branco: #ffffff;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(160deg, var(--amarelo-claro) 0%, var(--amarelo) 55%, #F5B300 100%);
      background-attachment: fixed;
      color: var(--azul-escuro);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 40px 20px 24px;
    }
    .container {
      width: 100%;
      max-width: 480px;
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ---------- Cabeçalho ---------- */
    header { text-align: center; margin-bottom: 36px; animation: subir .7s ease both; }
    .logo {
      width: 150px; height: 150px;
      margin: 0 auto 20px;
      border-radius: 50%;
      border: 5px solid var(--azul);
      box-shadow: 0 10px 28px rgba(11, 46, 107, .35);
      overflow: hidden;
      background: var(--amarelo);
    }
    .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }

    h1 {
      font-size: 2rem; font-weight: 900; letter-spacing: .5px;
      text-transform: uppercase; color: var(--azul);
      text-shadow: 2px 2px 0 var(--branco); line-height: 1.1;
    }

    /* Destaque Sarandi - RS */
    .local {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
      padding: 10px 24px 10px 16px;
      background: var(--azul-escuro);
      color: var(--amarelo);
      border: 3px solid var(--branco);
      border-radius: 999px;
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      box-shadow: 0 8px 20px rgba(11, 46, 107, .35);
      animation: pulsar 2.8s ease-in-out infinite;
    }
    .local svg { width: 26px; height: 26px; fill: var(--amarelo); flex-shrink: 0; }

    /* ---------- Botões ---------- */
    .links { width: 100%; display: flex; flex-direction: column; gap: 16px; }
    .btn {
      display: flex; align-items: center; gap: 16px;
      width: 100%; padding: 18px 22px;
      border-radius: 16px; text-decoration: none;
      font-size: 1.1rem; font-weight: 700; color: var(--branco);
      box-shadow: 0 8px 20px rgba(11, 46, 107, .25);
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
      animation: subir .7s ease both;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:nth-child(1) { animation-delay: .15s; }
    .btn:nth-child(2) { animation-delay: .3s; }
    .btn svg { width: 30px; height: 30px; flex-shrink: 0; fill: currentColor; }
    .btn span { flex: 1; text-align: center; padding-right: 30px; }
    .btn-whatsapp { background: var(--verde); }
    .btn-whatsapp:hover, .btn-whatsapp:focus-visible { background: var(--verde-escuro); }
    .btn-catalogo { background: var(--azul); }
    .btn-catalogo:hover, .btn-catalogo:focus-visible { background: var(--azul-escuro); }
    .btn:hover, .btn:focus-visible {
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 14px 28px rgba(11, 46, 107, .35);
      outline: none;
    }
    .btn:active { transform: scale(.98); }

    /* ---------- Rodapé ---------- */
    footer { margin-top: 40px; font-size: .8rem; text-align: center; color: var(--azul-escuro); opacity: .8; }

    @keyframes subir { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes pulsar { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    @media (min-width: 600px) { body { padding-top: 70px; } h1 { font-size: 2.3rem; } }
  </style>
</head>
